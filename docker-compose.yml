services:
  guardiandrive:
    build: .
    container_name: guardiandrive_ai
    ports:
      - "8000:8000"
    environment:
      - DMS_EMAIL_ENABLED=${DMS_EMAIL_ENABLED:-false}
      - DMS_SMTP_HOST=${DMS_SMTP_HOST:-smtp.gmail.com}
      - DMS_SMTP_PORT=${DMS_SMTP_PORT:-587}
      - DMS_SMTP_USER=${DMS_SMTP_USER:-}
      - DMS_SMTP_PASSWORD=${DMS_SMTP_PASSWORD:-}
      - DMS_ALERT_RECIPIENTS=${DMS_ALERT_RECIPIENTS:-}
      - DMS_EMAIL_ONLY_ON_SOS=${DMS_EMAIL_ONLY_ON_SOS:-true}
      - DMS_VOICE_ENABLED=${DMS_VOICE_ENABLED:-true}
      - DMS_GPS_MODE=${DMS_GPS_MODE:-simulated}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
